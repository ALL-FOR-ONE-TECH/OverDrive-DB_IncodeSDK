name: Build Native Libraries

on:
  # Triggered manually or by the server repo after it builds
  workflow_dispatch:
    inputs:
      server_sha:
        description: 'OverDrive-DB server commit SHA that was built'
        required: false
        default: 'latest'
  # Also run when binaries are pushed directly to main
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: write

env:
  SDK_VERSION: "2.2.0"

jobs:

# ══════════════════════════════════════════════════════════════════════════════
# BUILD — All 5 platforms (when triggered manually)
# Normally the server repo pushes binaries via sync-incodesdk.yml
# ══════════════════════════════════════════════════════════════════════════════

  build-windows-x64:
    name: "🪟 Windows x64"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: sdk-windows-x64-${{ hashFiles('_server/Cargo.lock') }}

      - name: Build overdrive.dll
        run: |
          cd _server
          cargo build --release --features ffi
          $size = [math]::Round((Get-Item "target\release\overdrive_db.dll").Length / 1KB)
          Write-Host "✅ overdrive_db.dll ($($size) KB)"

      - name: Copy to lib/windows-x64/
        run: |
          New-Item -ItemType Directory -Force "lib\windows-x64" | Out-Null
          Copy-Item "_server\target\release\overdrive_db.dll" "lib\windows-x64\overdrive.dll" -Force
          $size = [math]::Round((Get-Item "lib\windows-x64\overdrive.dll").Length / 1KB)
          Write-Host "✅ lib/windows-x64/overdrive.dll ($($size) KB)"

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: lib/windows-x64/overdrive.dll
          retention-days: 1

  build-linux-x64:
    name: "🐧 Linux x64"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: sdk-linux-x64-${{ hashFiles('_server/Cargo.lock') }}

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libssl-dev

      - name: Build liboverdrive.so
        run: |
          cd _server
          cargo build --release --features ffi
          ls -lh target/release/liboverdrive_db.so

      - name: Copy to lib/linux-x64/
        run: |
          mkdir -p lib/linux-x64
          cp _server/target/release/liboverdrive_db.so lib/linux-x64/liboverdrive.so
          echo "✅ lib/linux-x64/liboverdrive.so ($(du -sh lib/linux-x64/liboverdrive.so | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: lib/linux-x64/liboverdrive.so
          retention-days: 1

  build-linux-arm64:
    name: "🐧 Linux ARM64"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: sdk-linux-arm64-${{ hashFiles('_server/Cargo.lock') }}

      - name: Install cross-linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config libssl-dev
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build liboverdrive.so (ARM64)
        run: |
          cd _server
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          cargo build --release --features ffi --target aarch64-unknown-linux-gnu

      - name: Copy to lib/linux-arm64/
        run: |
          mkdir -p lib/linux-arm64
          cp _server/target/aarch64-unknown-linux-gnu/release/liboverdrive_db.so lib/linux-arm64/liboverdrive.so
          echo "✅ lib/linux-arm64/liboverdrive.so ($(du -sh lib/linux-arm64/liboverdrive.so | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: lib/linux-arm64/liboverdrive.so
          retention-days: 1

  build-macos-x64:
    name: "🍎 macOS x64 (Intel)"
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: sdk-macos-x64-${{ hashFiles('_server/Cargo.lock') }}

      - name: Build liboverdrive.dylib (Intel)
        run: |
          cd _server
          cargo build --release --features ffi --target x86_64-apple-darwin
          ls -lh target/x86_64-apple-darwin/release/liboverdrive_db.dylib

      - name: Copy to lib/macos-x64/
        run: |
          mkdir -p lib/macos-x64
          cp _server/target/x86_64-apple-darwin/release/liboverdrive_db.dylib lib/macos-x64/liboverdrive.dylib
          echo "✅ lib/macos-x64/liboverdrive.dylib ($(du -sh lib/macos-x64/liboverdrive.dylib | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-x64
          path: lib/macos-x64/liboverdrive.dylib
          retention-days: 1

  build-macos-arm64:
    name: "🍎 macOS ARM64 (Apple Silicon)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: sdk-macos-arm64-${{ hashFiles('_server/Cargo.lock') }}

      - name: Build liboverdrive.dylib (Apple Silicon)
        run: |
          cd _server
          cargo build --release --features ffi --target aarch64-apple-darwin
          ls -lh target/aarch64-apple-darwin/release/liboverdrive_db.dylib

      - name: Copy to lib/macos-arm64/
        run: |
          mkdir -p lib/macos-arm64
          cp _server/target/aarch64-apple-darwin/release/liboverdrive_db.dylib lib/macos-arm64/liboverdrive.dylib
          echo "✅ lib/macos-arm64/liboverdrive.dylib ($(du -sh lib/macos-arm64/liboverdrive.dylib | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64
          path: lib/macos-arm64/liboverdrive.dylib
          retention-days: 1

# ══════════════════════════════════════════════════════════════════════════════
# COMMIT + E2E VALIDATE
# ══════════════════════════════════════════════════════════════════════════════

  commit-and-validate:
    name: "📦 Commit Binaries + E2E"
    needs:
      - build-windows-x64
      - build-linux-x64
      - build-linux-arm64
      - build-macos-x64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts/

      - name: Organize lib/
        run: |
          mkdir -p lib/{windows-x64,linux-x64,linux-arm64,macos-x64,macos-arm64}
          cp _artifacts/native-windows-x64/overdrive.dll       lib/windows-x64/overdrive.dll
          cp _artifacts/native-linux-x64/liboverdrive.so       lib/linux-x64/liboverdrive.so
          cp _artifacts/native-linux-arm64/liboverdrive.so     lib/linux-arm64/liboverdrive.so
          cp _artifacts/native-macos-x64/liboverdrive.dylib    lib/macos-x64/liboverdrive.dylib
          cp _artifacts/native-macos-arm64/liboverdrive.dylib  lib/macos-arm64/liboverdrive.dylib
          echo "=== Final lib/ ==="
          ls -lh lib/*/*

      - name: Generate CHECKSUMS.md
        run: |
          cd lib
          {
            echo "# Native Library Checksums — OverDrive-DB v${SDK_VERSION}"
            echo ""
            echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Algorithm:** SHA-256"
            echo ""
            echo "| Platform | File | SHA-256 | Size |"
            echo "|---|---|---|---|"
            for f in windows-x64/overdrive.dll linux-x64/liboverdrive.so linux-arm64/liboverdrive.so macos-x64/liboverdrive.dylib macos-arm64/liboverdrive.dylib; do
              if [ -f "$f" ]; then
                hash=$(sha256sum "$f" | cut -d' ' -f1)
                size=$(du -sh "$f" | cut -f1)
                echo "| ${f%/*} | $(basename $f) | \`${hash:0:16}...\` | $size |"
              fi
            done
          } > CHECKSUMS.md
          cat CHECKSUMS.md

      - name: Commit binaries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/
          if git diff --staged --quiet; then
            echo "✅ No changes"
          else
            git commit -m "ci: native libs v${SDK_VERSION} — all 5 platforms [skip ci]

          windows-x64, linux-x64, linux-arm64, macos-x64, macos-arm64
          Server SHA: ${{ github.event.inputs.server_sha }}
          Run: ${{ github.run_number }}"
            git push origin main
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: E2E — Node.js (using fresh linux-x64 lib)
        run: |
          export OVERDRIVE_LIB_PATH=$(pwd)/lib/linux-x64/liboverdrive.so
          cd nodejs && npm install --silent && node test/e2e.js

      - name: Summary
        run: |
          echo "## ✅ IncodeSDK v${SDK_VERSION} — Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows x64 | ✅ overdrive.dll |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux x64 | ✅ liboverdrive.so |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux ARM64 | ✅ liboverdrive.so |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS x64 | ✅ liboverdrive.dylib |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS ARM64 | ✅ liboverdrive.dylib |" >> $GITHUB_STEP_SUMMARY
