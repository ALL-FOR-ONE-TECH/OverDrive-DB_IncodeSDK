name: Build Native Libraries + GitHub Release

# ┌─────────────────────────────────────────────────────────────────┐
# │  OverDrive-DB_IncodeSDK — PRIMARY BUILD & RELEASE WORKFLOW      │
# │                                                                 │
# │  This workflow:                                                 │
# │  1. Checks out private server source (karthikeyanV2K/OverDrive-DB)│
# │  2. Builds native libs for 5 platforms in parallel             │
# │  3. Commits binaries into lib/{platform}/ in THIS repo         │
# │  4. Creates a GitHub Release with all native libs as assets    │
# │                                                                 │
# │  Triggered by:                                                  │
# │   • git tag push  v*.*.*  (full build + release)               │
# │   • workflow_dispatch     (manual, optional release)           │
# │   • push to main          (binary-only commit, no release)     │
# └─────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - ".github/workflows/build-native-libs.yml"
    tags:
      - "v*.*.*"
  # Triggered by private server repo via peter-evans/repository-dispatch
  repository_dispatch:
    types: [build-native-libs]
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version (e.g. 2.3.0)"
        required: false
        default: "2.3.0"
      create_release:
        description: "Create a GitHub Release? (true/false)"
        required: false
        default: "false"
      server_sha:
        description: "Private server commit SHA to build from (leave empty for latest)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SDK_VERSION: "2.3.0"

permissions:
  contents: write

jobs:

# ══════════════════════════════════════════════════════════════════════════════
# BUILD — All 5 platforms in parallel
# Checks out karthikeyanV2K/OverDrive-DB (private) and builds with --features ffi
# ══════════════════════════════════════════════════════════════════════════════

  build-windows-x64:
    name: "🪟 Windows x64"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.server_sha || 'master' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: win-x64-${{ hashFiles('_server/Cargo.lock') }}
          restore-keys: win-x64-

      - name: Build overdrive.dll
        run: |
          cd _server
          cargo build --release --features ffi
          $size = [math]::Round((Get-Item "target\release\overdrive_db.dll").Length / 1MB, 2)
          Write-Host "✅ overdrive_db.dll — $($size) MB"

      - name: Verify FFI symbols
        shell: pwsh
        run: |
          $out = & dumpbin /exports "_server\target\release\overdrive_db.dll" 2>&1
          if ($out -notmatch 'overdrive_open') {
            Write-Error "FAIL: overdrive_open not found in DLL exports"
            exit 1
          }
          Write-Host "✅ overdrive_open verified"

      - name: Stage
        run: |
          New-Item -ItemType Directory -Force "dist\windows-x64" | Out-Null
          Copy-Item "_server\target\release\overdrive_db.dll" "dist\windows-x64\overdrive.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: dist/windows-x64/overdrive.dll
          retention-days: 7

  build-linux-x64:
    name: "🐧 Linux x64"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.server_sha || 'master' }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: linux-x64-${{ hashFiles('_server/Cargo.lock') }}
          restore-keys: linux-x64-

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libssl-dev

      - name: Build liboverdrive.so
        run: |
          cd _server
          cargo build --release --features ffi
          nm -D target/release/liboverdrive_db.so | grep -q overdrive_open && echo "✅ Symbols OK" || (echo "FAIL: overdrive_open missing" && exit 1)

      - name: Stage
        run: |
          mkdir -p dist/linux-x64
          cp _server/target/release/liboverdrive_db.so dist/linux-x64/liboverdrive.so
          echo "✅ $(du -sh dist/linux-x64/liboverdrive.so | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: dist/linux-x64/liboverdrive.so
          retention-days: 7

  build-linux-arm64:
    name: "🐧 Linux ARM64"
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.server_sha || 'master' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: linux-arm64-${{ hashFiles('_server/Cargo.lock') }}
          restore-keys: linux-arm64-

      - name: Install cross-linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config libssl-dev
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build liboverdrive.so (ARM64)
        run: |
          cd _server
          cargo build --release --features ffi --target aarch64-unknown-linux-gnu

      - name: Stage
        run: |
          mkdir -p dist/linux-arm64
          cp _server/target/aarch64-unknown-linux-gnu/release/liboverdrive_db.so dist/linux-arm64/liboverdrive.so
          echo "✅ $(du -sh dist/linux-arm64/liboverdrive.so | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: dist/linux-arm64/liboverdrive.so
          retention-days: 7

  build-macos:
    name: "${{ matrix.label }}"
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            label: "🍎 macOS x64 (Intel)"
            artifact: native-macos-x64
            out_dir: dist/macos-x64
            lib_name: liboverdrive.dylib

          - target: aarch64-apple-darwin
            label: "🍎 macOS ARM64 (Apple Silicon)"
            artifact: native-macos-arm64
            out_dir: dist/macos-arm64
            lib_name: liboverdrive.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Checkout private server source
        uses: actions/checkout@v4
        with:
          repository: karthikeyanV2K/OverDrive-DB
          path: _server
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.server_sha || 'master' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _server/target
          key: macos-${{ matrix.target }}-${{ hashFiles('_server/Cargo.lock') }}
          restore-keys: macos-${{ matrix.target }}-

      - name: Build liboverdrive.dylib
        run: |
          cd _server
          cargo build --release --features ffi --target ${{ matrix.target }}
          ls -lh target/${{ matrix.target }}/release/liboverdrive_db.dylib

      - name: Stage
        run: |
          mkdir -p ${{ matrix.out_dir }}
          cp _server/target/${{ matrix.target }}/release/liboverdrive_db.dylib \
             ${{ matrix.out_dir }}/${{ matrix.lib_name }}
          echo "✅ $(du -sh ${{ matrix.out_dir }}/${{ matrix.lib_name }} | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out_dir }}/${{ matrix.lib_name }}
          retention-days: 7

# ══════════════════════════════════════════════════════════════════════════════
# COMMIT — Commit all native libs into lib/{platform}/ in THIS repo
# ══════════════════════════════════════════════════════════════════════════════

  commit-libs:
    name: "📦 Commit libs to repo"
    needs: [build-windows-x64, build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts/

      - name: Organize into lib/
        run: |
          mkdir -p lib/{windows-x64,linux-x64,linux-arm64,macos-x64,macos-arm64}
          cp _artifacts/native-windows-x64/overdrive.dll       lib/windows-x64/overdrive.dll
          cp _artifacts/native-linux-x64/liboverdrive.so       lib/linux-x64/liboverdrive.so
          cp _artifacts/native-linux-arm64/liboverdrive.so     lib/linux-arm64/liboverdrive.so
          cp _artifacts/native-macos-x64/liboverdrive.dylib    lib/macos-x64/liboverdrive.dylib
          cp _artifacts/native-macos-arm64/liboverdrive.dylib  lib/macos-arm64/liboverdrive.dylib
          echo "=== lib/ sizes ==="
          du -sh lib/*/*

      - name: Generate CHECKSUMS.md
        run: |
          cd lib
          {
            echo "# Native Library Checksums — OverDrive-DB v${SDK_VERSION}"
            echo ""
            echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Algorithm:** SHA-256"
            echo ""
            echo "| Platform | File | SHA-256 | Size |"
            echo "|---|---|---|---|"
            for f in windows-x64/overdrive.dll linux-x64/liboverdrive.so \
                     linux-arm64/liboverdrive.so macos-x64/liboverdrive.dylib \
                     macos-arm64/liboverdrive.dylib; do
              [ -f "$f" ] || continue
              hash=$(sha256sum "$f" | cut -d' ' -f1)
              size=$(du -sh "$f" | cut -f1)
              echo "| ${f%/*} | $(basename $f) | \`${hash:0:16}...\` | $size |"
            done
          } > CHECKSUMS.md
          cat CHECKSUMS.md

      - name: Commit & push
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ CHECKSUMS.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "✅ No lib changes — skipping commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "ci: native libs v${SDK_VERSION} — all 5 platforms [skip ci]

          windows-x64 | linux-x64 | linux-arm64 | macos-x64 | macos-arm64
          Trigger: ${{ github.event_name }} | Run: ${{ github.run_number }}"
            git push origin HEAD
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

# ══════════════════════════════════════════════════════════════════════════════
# GITHUB RELEASE — Only on tag push (v*.*.*) or manual with create_release=true
# ══════════════════════════════════════════════════════════════════════════════

  github-release:
    name: "🚀 GitHub Release"
    needs: [build-windows-x64, build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ github.event.inputs.version || env.SDK_VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: _artifacts/

      - name: Prepare versioned release assets + SHA256SUMS
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          mkdir -p release-assets

          cp _artifacts/native-windows-x64/overdrive.dll         release-assets/overdrive_db-${TAG}-windows-x64.dll
          cp _artifacts/native-linux-x64/liboverdrive.so         release-assets/liboverdrive_db-${TAG}-linux-x64.so
          cp _artifacts/native-linux-arm64/liboverdrive.so       release-assets/liboverdrive_db-${TAG}-linux-arm64.so
          cp _artifacts/native-macos-x64/liboverdrive.dylib      release-assets/liboverdrive_db-${TAG}-macos-x64.dylib
          cp _artifacts/native-macos-arm64/liboverdrive.dylib    release-assets/liboverdrive_db-${TAG}-macos-arm64.dylib

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OverDrive-DB ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          fail_on_unmatched_files: false
          files: |
            release-assets/overdrive_db-${{ steps.tag.outputs.tag }}-windows-x64.dll
            release-assets/liboverdrive_db-${{ steps.tag.outputs.tag }}-linux-x64.so
            release-assets/liboverdrive_db-${{ steps.tag.outputs.tag }}-linux-arm64.so
            release-assets/liboverdrive_db-${{ steps.tag.outputs.tag }}-macos-x64.dylib
            release-assets/liboverdrive_db-${{ steps.tag.outputs.tag }}-macos-arm64.dylib
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Step Summary
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          echo "## 🚀 OverDrive-DB ${TAG} Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Platform |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`overdrive_db-${TAG}-windows-x64.dll\` | 🪟 Windows x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| \`liboverdrive_db-${TAG}-linux-x64.so\` | 🐧 Linux x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| \`liboverdrive_db-${TAG}-linux-arm64.so\` | 🐧 Linux ARM64 |" >> $GITHUB_STEP_SUMMARY
          echo "| \`liboverdrive_db-${TAG}-macos-x64.dylib\` | 🍎 macOS x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| \`liboverdrive_db-${TAG}-macos-arm64.dylib\` | 🍎 macOS ARM64 |" >> $GITHUB_STEP_SUMMARY
          echo "| \`SHA256SUMS.txt\` | All platforms |" >> $GITHUB_STEP_SUMMARY
