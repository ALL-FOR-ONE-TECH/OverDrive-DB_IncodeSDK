name: Publish SDKs — npm · PyPI · crates.io

# ┌─────────────────────────────────────────────────────────────────┐
# │  OverDrive-DB_IncodeSDK — PUBLISH WORKFLOW                      │
# │                                                                 │
# │  Publishes overdrive-db to:                                     │
# │   • npm        → npmjs.com          (NPM_TOKEN)                 │
# │   • PyPI       → pypi.org           (PYPI_API_TOKEN)            │
# │   • crates.io  → crates.io          (CRATES_IO_TOKEN)           │
# │                                                                 │
# │  Triggered by:                                                  │
# │   • git tag push  v*.*.*  (auto-publish)                        │
# │   • workflow_dispatch     (manual, choose targets)              │
# └─────────────────────────────────────────────────────────────────┘

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.3.0)"
        required: true
        default: "2.3.0"
      targets:
        description: "Registries to publish (all | npm | pypi | crates)"
        required: false
        default: "all"

env:
  SDK_VERSION: "2.3.0"

permissions:
  contents: read

# Helper: extract version from tag (strips 'v' prefix) or use input
# Used in every job via: ${{ env.PUBLISH_VERSION }}

jobs:

# ══════════════════════════════════════════════════════════════════════════════
# RESOLVE VERSION — single source of truth
# ══════════════════════════════════════════════════════════════════════════════

  resolve-version:
    name: "🔖 Resolve version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ github.event.inputs.version || env.SDK_VERSION }}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "📌 Publishing version: ${VER}"

# ══════════════════════════════════════════════════════════════════════════════
# npm — overdrive-db on npmjs.com
# ══════════════════════════════════════════════════════════════════════════════

  publish-npm:
    name: "📦 npm → npmjs.com"
    needs: resolve-version
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.targets == '' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'npm'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Pin version in package.json
        working-directory: nodejs
        run: |
          npm version ${{ needs.resolve-version.outputs.version }} --no-git-tag-version --allow-same-version
          echo "📦 overdrive-db@$(node -p "require('./package.json').version")"

      - name: Install dependencies
        working-directory: nodejs
        run: npm install --ignore-scripts

      - name: Publish
        working-directory: nodejs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: echo "✅ overdrive-db@${{ needs.resolve-version.outputs.version }} → npm"

# ══════════════════════════════════════════════════════════════════════════════
# PyPI — overdrive-db on pypi.org
# ══════════════════════════════════════════════════════════════════════════════

  publish-pypi:
    name: "🐍 PyPI → pypi.org"
    needs: resolve-version
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.targets == '' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'pypi'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade hatch build twine --quiet

      - name: Pin version in pyproject.toml
        working-directory: python
        run: |
          VER=${{ needs.resolve-version.outputs.version }}
          sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          grep "^version" pyproject.toml

      - name: Build wheel + sdist
        working-directory: python
        run: python -m build

      - name: Validate
        working-directory: python
        run: twine check dist/*

      - name: Publish
        working-directory: python
        run: twine upload dist/* --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - run: echo "✅ overdrive-db==${{ needs.resolve-version.outputs.version }} → PyPI"

# ══════════════════════════════════════════════════════════════════════════════
# crates.io — overdrive-db on crates.io
# ══════════════════════════════════════════════════════════════════════════════

  publish-crates:
    name: "🦀 crates.io → crates.io"
    needs: resolve-version
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.targets == '' ||
      github.event.inputs.targets == 'all' ||
      github.event.inputs.targets == 'crates'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: crates-publish-${{ hashFiles('rust/Cargo.toml') }}

      - name: Pin version in Cargo.toml
        working-directory: rust
        run: |
          VER=${{ needs.resolve-version.outputs.version }}
          sed -i "s/^version.*=.*\"[^\"]*\"/version     = \"${VER}\"/" Cargo.toml
          grep "^version" Cargo.toml

      - name: Validate package
        working-directory: rust
        run: cargo package --allow-dirty --list

      - name: Publish
        working-directory: rust
        run: cargo publish --allow-dirty --token ${{ secrets.CRATES_IO_TOKEN }}

      - run: echo "✅ overdrive-db ${{ needs.resolve-version.outputs.version }} → crates.io"

# ══════════════════════════════════════════════════════════════════════════════
# SUMMARY
# ══════════════════════════════════════════════════════════════════════════════

  summary:
    name: "📋 Publish Summary"
    needs: [resolve-version, publish-npm, publish-pypi, publish-crates]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write summary
        run: |
          VER=${{ needs.resolve-version.outputs.version }}
          npm_status="${{ needs.publish-npm.result }}"
          pypi_status="${{ needs.publish-pypi.result }}"
          crates_status="${{ needs.publish-crates.result }}"

          icon() { case $1 in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }

          echo "## 🚀 OverDrive-DB v${VER} — SDK Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| npm | overdrive-db@${VER} | $(icon $npm_status) |" >> $GITHUB_STEP_SUMMARY
          echo "| PyPI | overdrive-db==${VER} | $(icon $pypi_status) |" >> $GITHUB_STEP_SUMMARY
          echo "| crates.io | overdrive-db ${VER} | $(icon $crates_status) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install overdrive-db@${VER}" >> $GITHUB_STEP_SUMMARY
          echo "pip install overdrive-db==${VER}" >> $GITHUB_STEP_SUMMARY
          echo "cargo add overdrive-db@${VER}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
