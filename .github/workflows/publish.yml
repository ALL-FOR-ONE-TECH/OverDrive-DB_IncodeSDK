name: Publish to All Registries

on:
  push:
    tags:
      - 'v*'           # triggers on: git tag v2.2.0 && git push --tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.2.0)'
        required: true
        default: '2.2.0'

env:
  SDK_VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write
  packages: write   # needed for GitHub Packages (Maven)

jobs:

# ══════════════════════════════════════════════════════════════════════════════
# NPM — overdrive-db
# Secret: NPM_TOKEN  (npmjs.com → Access Tokens → Automation token)
# ══════════════════════════════════════════════════════════════════════════════
  publish-npm:
    name: "📦 NPM — overdrive-db"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        run: |
          VERSION="${{ env.SDK_VERSION }}"
          VERSION="${VERSION#v}"   # strip leading 'v' if present
          cd nodejs
          npm version "$VERSION" --no-git-tag-version
          echo "Publishing overdrive-db@$VERSION"

      - name: Install & publish
        run: |
          cd nodejs
          npm install --ignore-scripts
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# ══════════════════════════════════════════════════════════════════════════════
# PyPI — overdrive-db
# Secret: PYPI_TOKEN  (pypi.org → Account Settings → API Tokens)
# ══════════════════════════════════════════════════════════════════════════════
  publish-pypi:
    name: "🐍 PyPI — overdrive-db"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Set version
        run: |
          VERSION="${{ env.SDK_VERSION }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" python/pyproject.toml
          echo "Publishing overdrive-db==$VERSION to PyPI"

      - name: Build wheel
        run: |
          cd python
          python -m build

      - name: Upload to PyPI
        run: |
          cd python
          python -m twine upload dist/* --non-interactive
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

# ══════════════════════════════════════════════════════════════════════════════
# crates.io — overdrive-sdk
# Secret: CARGO_REGISTRY_TOKEN  (crates.io → Account Settings → API Tokens)
# ══════════════════════════════════════════════════════════════════════════════
  publish-cargo:
    name: "🦀 crates.io — overdrive-sdk"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set version
        run: |
          VERSION="${{ env.SDK_VERSION }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version.*=.*/version = \"$VERSION\"/" rust/Cargo.toml
          sed -i "s/^version.*=.*/version = \"$VERSION\"/" Cargo.toml
          echo "Publishing overdrive-sdk v$VERSION to crates.io"

      - name: Publish to crates.io
        run: cargo publish --manifest-path rust/Cargo.toml --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

# ══════════════════════════════════════════════════════════════════════════════
# GitHub Packages (Maven) — com.afot:overdrive-db
# Uses built-in GITHUB_TOKEN — no extra secret needed
# ══════════════════════════════════════════════════════════════════════════════
  publish-maven:
    name: "☕ GitHub Packages — com.afot:overdrive-db"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set version
        run: |
          VERSION="${{ env.SDK_VERSION }}"
          VERSION="${VERSION#v}"
          mvn -f java/pom.xml versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          echo "Publishing com.afot:overdrive-db:$VERSION"

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Add GitHub Packages distribution to pom.xml
        run: |
          # Inject distributionManagement into pom.xml if not present
          if ! grep -q "distributionManagement" java/pom.xml; then
            sed -i 's|</project>|<distributionManagement><repository><id>github</id><name>GitHub Packages</name><url>https://maven.pkg.github.com/${{ github.repository }}</url></repository></distributionManagement></project>|' java/pom.xml
          fi

      - name: Publish to GitHub Packages
        run: mvn -f java/pom.xml deploy -DskipTests --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ══════════════════════════════════════════════════════════════════════════════
# Go — github.com/ALL-FOR-ONE-TECH/overdrive-db-go
# No token needed — Go modules are published via git tags
# ══════════════════════════════════════════════════════════════════════════════
  publish-go:
    name: "🐹 Go Module tag"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Push go/ prefixed tag for Go module proxy
        run: |
          VERSION="${{ env.SDK_VERSION }}"
          VERSION="${VERSION#v}"
          GO_TAG="go/v${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$GO_TAG" >/dev/null 2>&1; then
            echo "Tag $GO_TAG already exists — skipping"
          else
            git tag "$GO_TAG"
            git push origin "$GO_TAG"
            echo "✅ Pushed $GO_TAG — module available at:"
            echo "   go get github.com/ALL-FOR-ONE-TECH/overdrive-db-go@v${VERSION}"
          fi

# ══════════════════════════════════════════════════════════════════════════════
# SUMMARY — GitHub Release with all artifacts
# ══════════════════════════════════════════════════════════════════════════════
  create-release:
    name: "🚀 GitHub Release"
    needs: [publish-npm, publish-pypi, publish-cargo, publish-maven, publish-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Python wheel for release asset
        run: |
          pip install build
          cd python && python -m build

      - name: Build Java JAR for release asset
        run: mvn -f java/pom.xml package -DskipTests --no-transfer-progress -q

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OverDrive-DB InCode SDK ${{ github.ref_name }}"
          body: |
            ## OverDrive-DB InCode SDK ${{ github.ref_name }}

            Zero-config embedded document database SDK — all 5 languages.

            ### Published to
            | Registry | Package | Install |
            |---|---|---|
            | NPM | `overdrive-db` | `npm install overdrive-db` |
            | PyPI | `overdrive-db` | `pip install overdrive-db` |
            | crates.io | `overdrive-sdk` | `cargo add overdrive-sdk` |
            | GitHub Packages | `com.afot:overdrive-db` | see pom.xml |
            | Go | `overdrive-db-go` | `go get github.com/ALL-FOR-ONE-TECH/overdrive-db-go@${{ github.ref_name }}` |

            ### Native Libraries
            Built for: Windows x64, Linux x64, Linux ARM64, macOS x64, macOS ARM64

            ### E2E Tests
            50/50 passing across all 5 SDKs ✅
          files: |
            python/dist/*.whl
            python/dist/*.tar.gz
            java/target/overdrive-db-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
