[package]
name        = "overdrive-db"
version     = "2.3.1"
edition     = "2021"
authors     = ["AFOT <admin@afot.in>"]
description = "OverDrive-DB embedded SDK — ACID transactions, AES-256 encryption, WAL durability, 6 storage engines. The SQLite alternative built in Rust."
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/ALL-FOR-ONE-TECH/OverDrive-DB_IncodeSDK"
homepage    = "https://overdrive-db.com"
documentation = "https://docs.rs/overdrive-db"
keywords    = ["database", "embedded", "nosql", "document", "sqlite"]
categories  = ["database", "api-bindings"]
readme      = "README.md"

[lib]
name = "overdrive"

[dependencies]
serde_json = "1.0"
libloading = "0.8"

[dev-dependencies]
serde_json = "1.0"
